plugins { id 'com.android.application' }

android {
    namespace 'com.searvator.ibsrunner'
    compileSdk 34

    defaultConfig {
        applicationId "com.searvator.ibsrunner"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "1.6"
        // Default server address. The runner can change it on the sign-in screen.
        buildConfigField "String", "DEFAULT_SERVER", "\"https://runnerapp-86d6.onrender.com\""
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// AndroidX pulls in the old kotlin-stdlib-jdk7 / jdk8 modules (1.6.0), while something else
// on the classpath brings kotlin-stdlib 1.8.22. From Kotlin 1.8 the jdk7/jdk8 modules were
// merged into the main stdlib, so having both produces "Duplicate class" errors at build time.
// Forcing all three to the same 1.8.22 version makes the jdk7/jdk8 jars empty stubs and the
// clash disappears. This project has no Kotlin source of its own - it is pure Java.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}
